  </div>

  <iframe id="app" title="Formulir Pendataan Usaha Warga PasarKoe" allow="geolocation; camera; clipboard-write"></iframe>

  <script>
  (function () {
    'use strict';
    /* ================= PENGATURAN =================
       EXEC : URL /exec Apps Script. Ganti HANYA bila Anda membuat "New deployment"
              (bila memakai "Manage deployments → Edit → New version", URL tetap sama).
       MODE : 'otomatis' → formulir tampil di link pendek; bila Google menolak, otomatis
                           dialihkan ke formulir (tanpa tombol, tanpa pesan error).
              'langsung' → selalu langsung dialihkan ke formulir (paling sederhana). */
    var EXEC = 'https://script.google.com/macros/s/AKfycbwWKoj7VA1_n9DLAoTCc0IRxYyUpLx14fo9Yv-13m7jHWOLTXAJzQ2pFhjBzXswRF71/exec';
    var MODE = 'otomatis';
    /* ============================================== */

    // Semua parameter ikut diteruskan, mis. ?cabang=BOJA
    var tujuan = EXEC + (location.search || '');
    var buka = document.getElementById('buka');
    var app = document.getElementById('app');
    var selesai = false;

    function catat(t) { try { console.info('[PasarKoe] ' + t); } catch (e) {} }

    function alihkan(alasan) {
      if (selesai) return;
      selesai = true;
      catat('dialihkan langsung ke formulir: ' + alasan);
      location.replace(tujuan); // replace: tombol Kembali tidak memantul ke halaman ini
    }

    function tampilkan(cara) {
      if (selesai) return;
      selesai = true;
      catat('formulir tampil di link pendek (' + cara + ')');
      buka.classList.add('selesai');
    }

    if (MODE === 'langsung') { alihkan('mode langsung'); return; }

    // 1) Formulir PasarKoe mengirim sinyal ini begitu tampil (paling cepat).
    window.addEventListener('message', function (e) {
      if (e.data === 'pasarkoe:siap') tampilkan('sinyal formulir');
    });

    // 2) Halaman Apps Script yang berhasil dimuat selalu berisi bingkai formulir.
    //    Bila Google menolak (X-Frame-Options) atau error, bingkainya tidak ada → dialihkan.
    app.addEventListener('load', function () {
      var mulai = Date.now();
      (function cek() {
        if (selesai) return;
        var n = 0;
        try { n = app.contentWindow ? app.contentWindow.length : 0; } catch (e) { n = 0; }
        if (n > 0) return tampilkan('bingkai Apps Script terdeteksi');
        if (Date.now() - mulai < 6000) return setTimeout(cek, 250);
        alihkan('Google tidak mengizinkan tampil di link pendek');
      })();
    });

    // 3) Pengaman terakhir: bila sangat lama tidak ada kepastian, langsung buka formulir.
    setTimeout(function () { alihkan('waktu tunggu habis'); }, 30000);

    app.src = tujuan;
  })();
  </script>
